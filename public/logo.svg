<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 565" fill="none">

  <!-- Gold outer circle ring -->
  <circle cx="250" cy="210" r="168" fill="none" stroke="#C9A84C" stroke-width="3.5"/>

  <!-- Nepal map outline (inside circle, gold ghost) -->
  <path d="
    M 108,182
    C 115,175 132,172 150,169 C 165,167 180,169 195,166
    C 209,163 223,166 238,163 C 252,160 266,163 280,160
    C 294,157 308,160 322,157 C 336,155 350,158 363,162
    L 376,168 L 382,179 L 383,193
    C 368,198 351,194 334,197 C 317,200 300,196 284,199
    C 268,202 252,198 235,201 C 219,204 202,200 187,197
    C 171,194 155,197 140,194
    L 126,190 L 113,187 Z"
    fill="none" stroke="#C9A84C" stroke-width="1.3" opacity="0.55"/>

  <!-- Mountain silhouette (dark espresso) -->
  <path d="
    M 78,378
    L 96,356 L 104,363 L 111,352 L 118,360 L 124,347
    L 137,322 L 143,332 L 150,319 L 156,329 L 162,316
    L 176,291 L 182,301 L 190,285 L 196,295 L 204,278
    L 218,258 L 224,268 L 231,252 L 238,248
    L 250,152
    L 262,248 L 269,252 L 276,268 L 282,258
    L 296,278 L 304,295 L 310,285 L 318,301 L 324,291
    L 338,316 L 344,329 L 350,319 L 357,332 L 363,322
    L 376,347 L 382,360 L 389,352 L 396,363 L 404,356
    L 422,378
    Z"
    fill="#2C1608"/>

  <!-- Snow cap — centre peak -->
  <path d="M 250,152 L 236,187 L 240,179 L 244,193 L 250,183 L 256,193 L 260,179 L 264,187 Z"
        fill="#FFFFFF"/>

  <!-- Snow streaks — left ridges -->
  <path d="M 176,291 C 181,299 187,293 193,301 C 198,308 204,302 210,309"
        stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 218,258 C 223,266 229,260 234,268"
        stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Snow streaks — right ridges -->
  <path d="M 266,268 C 271,260 277,266 282,258"
        stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 290,309 C 296,302 302,308 307,301 C 313,293 319,299 324,291"
        stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Rocky texture lines — centre peak left face -->
  <line x1="244" y1="170" x2="230" y2="210" stroke="#3d1a08" stroke-width="1" opacity="0.5"/>
  <line x1="238" y1="195" x2="220" y2="240" stroke="#3d1a08" stroke-width="1" opacity="0.45"/>
  <line x1="228" y1="228" x2="210" y2="265" stroke="#3d1a08" stroke-width="1" opacity="0.4"/>

  <!-- Rocky texture lines — centre peak right face -->
  <line x1="256" y1="170" x2="270" y2="210" stroke="#3d1a08" stroke-width="1" opacity="0.5"/>
  <line x1="262" y1="195" x2="280" y2="240" stroke="#3d1a08" stroke-width="1" opacity="0.45"/>
  <line x1="272" y1="228" x2="290" y2="265" stroke="#3d1a08" stroke-width="1" opacity="0.4"/>

  <!-- Coffee bean at base of mountains -->
  <ellipse cx="250" cy="320" rx="21" ry="31" transform="rotate(-8 250 320)" fill="#3D2010"/>
  <!-- Bean crease -->
  <path d="M 243,291 C 252,304 247,315 254,331 C 259,341 252,350 248,358"
        stroke="#C9A84C" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Coffee cup — body -->
  <path d="M 226,138 L 231,166 L 269,166 L 274,138 Z" fill="#C9A84C"/>
  <!-- Cup top rim -->
  <ellipse cx="250" cy="138" rx="24" ry="5.5" fill="#9B7020"/>
  <!-- Cup bottom lip -->
  <ellipse cx="250" cy="166" rx="19" ry="4.5" fill="#9B7020"/>
  <!-- Handle -->
  <path d="M 269,147 C 288,147 292,157 289,164 C 286,171 269,169 269,169"
        fill="none" stroke="#C9A84C" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="250" cy="170" rx="30" ry="6.5" fill="#9B7020"/>

  <!-- Steam wisps (3 wavy gold lines) -->
  <path d="M 236,128 C 232,115 238,101 233,88 C 228,75 234,63 230,51"
        fill="none" stroke="#C9A84C" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 250,125 C 255,111 249,97 254,84 C 259,71 253,59 257,47"
        fill="none" stroke="#C9A84C" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 264,128 C 268,115 262,101 267,88 C 272,75 266,63 270,51"
        fill="none" stroke="#C9A84C" stroke-width="2.3" stroke-linecap="round"/>

  <!-- ── Typography ── -->

  <!-- HIMA -->
  <text x="250" y="450"
        font-family="Georgia,'Playfair Display','Times New Roman',serif"
        font-size="118"
        font-weight="700"
        fill="#2C1608"
        text-anchor="middle"
        letter-spacing="10">HIMA</text>

  <!-- Flanking lines for BEANS row -->
  <line x1="68"  y1="472" x2="142" y2="472" stroke="#C9A84C" stroke-width="1.8"/>
  <line x1="358" y1="472" x2="432" y2="472" stroke="#C9A84C" stroke-width="1.8"/>

  <!-- BEANS -->
  <text x="250" y="481"
        font-family="Georgia,'Playfair Display','Times New Roman',serif"
        font-size="26"
        font-weight="600"
        fill="#C9A84C"
        text-anchor="middle"
        letter-spacing="14">BEANS</text>

  <!-- CRAFTED ABOVE THE CLOUDS -->
  <text x="250" y="511"
        font-family="Georgia,'Playfair Display','Times New Roman',serif"
        font-size="12.5"
        fill="#2C1608"
        text-anchor="middle"
        letter-spacing="5.5">CRAFTED ABOVE THE CLOUDS</text>

  <!-- Decorative gold underline -->
  <line x1="210" y1="522" x2="290" y2="522" stroke="#C9A84C" stroke-width="1.5"/>

</svg>
