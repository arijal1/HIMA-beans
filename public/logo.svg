<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 570" fill="none">

  <!-- ── Gold outer circle ring ── -->
  <circle cx="250" cy="205" r="155" fill="none" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- ── Nepal map outline (inside circle, subtle ghost) ── -->
  <path d="
    M 178,154
    C 185,147 198,150 212,146
    C 224,142 236,146 250,143
    C 263,140 276,144 290,141
    C 303,138 316,142 330,139
    L 344,145 L 352,156 L 354,170 L 351,182
    C 337,186 322,183 308,186
    C 294,188 280,185 266,188
    C 252,190 238,187 224,189
    C 210,191 196,188 184,185
    L 175,175 L 174,162 Z"
    fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.42"/>

  <!-- ── Mountain silhouette (dark espresso) ── -->
  <path d="
    M 63,368
    L 115,312 L 130,323 L 142,310 L 154,320
    L 170,272 L 180,283 L 188,271 L 197,281 L 203,270
    L 218,248 L 225,257 L 232,247
    L 250,208
    L 268,247 L 275,257 L 282,248
    L 298,268 L 308,259 L 318,270 L 326,261
    L 343,250 L 352,261 L 362,252 L 372,262 L 380,254
    L 397,286 L 412,298 L 426,316 L 437,368
    Z"
    fill="#2C1608"/>

  <!-- ── Snow cap — centre peak ── -->
  <path d="M 250,208 L 237,236 L 242,230 L 244,240 L 250,232 L 256,240 L 258,230 L 263,236 Z"
        fill="#FFFFFF"/>

  <!-- ── Snow highlight — left ridge ── -->
  <path d="M 170,272 C 175,279 180,274 185,280 C 190,285 196,279 202,285"
        stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- ── Snow highlight — right ridge ── -->
  <path d="M 343,250 C 349,257 354,252 360,258 C 365,263 371,258 377,264"
        stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- ── Coffee bean (centre base of mountains) ── -->
  <ellipse cx="250" cy="324" rx="19" ry="28" transform="rotate(-8 250 324)" fill="#3D2010"/>
  <!-- Bean crease (S-curve, gold) -->
  <path d="M 244,298 C 251,308 247,317 253,330 C 257,338 251,345 247,352"
        stroke="#C9A84C" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- ── Coffee cup (gold, sitting on centre peak) ── -->
  <!-- Cup body -->
  <path d="M 229,192 L 233,214 L 267,214 L 271,192 Z" fill="#C9A84C"/>
  <!-- Cup top rim -->
  <ellipse cx="250" cy="192" rx="21" ry="4.5" fill="#A87C28"/>
  <!-- Cup bottom lip -->
  <ellipse cx="250" cy="214" rx="17" ry="3.5" fill="#A87C28"/>
  <!-- Handle (right side) -->
  <path d="M 267,200 C 282,200 285,207 282,212 C 279,217 267,216 267,216"
        fill="none" stroke="#C9A84C" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="250" cy="217" rx="27" ry="5.5" fill="#A87C28"/>

  <!-- ── Steam wisps (3 wavy gold lines) ── -->
  <path d="M 237,182 C 234,171 239,161 235,150 C 232,140 236,130 233,120"
        fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
  <path d="M 250,179 C 254,167 249,155 253,143 C 257,131 252,120 255,110"
        fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
  <path d="M 263,182 C 266,171 261,161 265,150 C 268,140 264,130 267,120"
        fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>

  <!-- ══════════════════════════════ -->
  <!--          Typography           -->
  <!-- ══════════════════════════════ -->

  <!-- HIMA — large, dark espresso, bold serif -->
  <text x="250" y="452"
        font-family="Georgia,'Playfair Display','Times New Roman',serif"
        font-size="110"
        font-weight="700"
        fill="#2C1608"
        text-anchor="middle"
        letter-spacing="10">HIMA</text>

  <!-- Flanking lines for BEANS row -->
  <line x1="80"  y1="476" x2="142" y2="476" stroke="#C9A84C" stroke-width="1.5"/>
  <line x1="358" y1="476" x2="420" y2="476" stroke="#C9A84C" stroke-width="1.5"/>

  <!-- BEANS — gold, spaced -->
  <text x="250" y="485"
        font-family="Georgia,'Playfair Display','Times New Roman',serif"
        font-size="27"
        font-weight="600"
        fill="#C9A84C"
        text-anchor="middle"
        letter-spacing="12">BEANS</text>

  <!-- CRAFTED ABOVE THE CLOUDS — small caps, dark -->
  <text x="250" y="514"
        font-family="Georgia,'Playfair Display','Times New Roman',serif"
        font-size="12"
        fill="#2C1608"
        text-anchor="middle"
        letter-spacing="5.5">CRAFTED ABOVE THE CLOUDS</text>

  <!-- Decorative gold underline -->
  <line x1="212" y1="524" x2="288" y2="524" stroke="#C9A84C" stroke-width="1.2"/>

</svg>
